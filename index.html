<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>MEEG Productivity</title>
<meta name="app-version" content="3"/>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 54 46'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%2300e5d4'/%3E%3Cstop offset='100%25' stop-color='%230f8fff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpolygon points='0,4 30,4 21,16 0,16' fill='url(%23g)'/%3E%3Cpolygon points='5,19 35,19 26,31 5,31' fill='url(%23g)'/%3E%3Cpolygon points='10,34 40,34 31,46 10,46' fill='url(%23g)'/%3E%3C/svg%3E"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#00e5d4;--blue:#0f8fff;--teal-deep:#00b8ac;--blue-deep:#0b6fd1;
  --bg-1:#eafcfb;--bg-2:#e7f1ff;--bg-3:#f3fbff;
  --bg:linear-gradient(160deg,#eafcfb 0%,#eef6ff 45%,#e9f0ff 100%);
  --card:rgba(255,255,255,0.72);--elevated:rgba(255,255,255,0.55);
  --border:rgba(15,143,255,0.22);--border-light:rgba(15,143,255,0.12);
  --glass:rgba(255,255,255,0.6);--glass-hover:rgba(255,255,255,0.86);
  --primary:#0b7d92;--primary-light:rgba(0,229,212,0.16);
  --accent:#0f8fff;--accent-light:rgba(15,143,255,0.14);
  --success:#17b978;--warning:#ffb238;--danger:#ff5f7e;--info:#0f8fff;
  --cmp-a:#0f8fff;--cmp-b:#00c2a8;
  --text:#0a2c3d;--text-soft:#3c6478;--muted:#7a9dae;
  --font:'Space Grotesk',system-ui,sans-serif;--display:'Baloo 2',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;
  --radius:16px;--radius-lg:26px;--radius-xl:34px;
  --shadow:0 8px 0 rgba(11,111,209,0.10),0 12px 30px rgba(11,111,209,0.14);
  --shadow-hover:0 10px 0 rgba(11,111,209,0.14),0 18px 40px rgba(11,111,209,0.20);
  --bevel-hi:rgba(255,255,255,0.9);--bevel-lo:rgba(11,111,209,0.18);
  --blur:blur(18px);
  --chrome-grad:linear-gradient(135deg,#ffffff 0%,#cdeffd 22%,#00e5d4 48%,#0f8fff 78%,#0a5fc4 100%);
  --scrollbar:rgba(15,143,255,0.35);
}
html[data-theme="dark"]{
  --bg-1:#050b16;--bg-2:#071827;--bg-3:#03222b;
  --bg:radial-gradient(circle at 15% 0%,#0a3247 0%,transparent 55%),radial-gradient(circle at 85% 10%,#072b3a 0%,transparent 50%),linear-gradient(160deg,#040a13 0%,#061420 60%,#03151d 100%);
  --card:rgba(10,26,38,0.62);--elevated:rgba(15,35,50,0.55);
  --border:rgba(0,229,212,0.22);--border-light:rgba(0,229,212,0.12);
  --glass:rgba(9,22,33,0.58);--glass-hover:rgba(14,32,46,0.78);
  --primary-light:rgba(0,229,212,0.14);--accent-light:rgba(15,143,255,0.18);
  --dk-accent:#5cf3e2;
  --text:#dff8fb;--text-soft:#8fc9d6;--muted:#4f7f92;
  --shadow:0 8px 0 rgba(0,0,0,0.45),0 14px 34px rgba(0,0,0,0.55);
  --shadow-hover:0 10px 0 rgba(0,0,0,0.5),0 20px 44px rgba(0,0,0,0.65);
  --bevel-hi:rgba(120,240,230,0.16);--bevel-lo:rgba(0,0,0,0.6);
  --chrome-grad:linear-gradient(135deg,#12313d 0%,#0d5563 22%,#00e5d4 48%,#0f8fff 78%,#062a52 100%);
  --scrollbar:rgba(0,229,212,0.3);
}
html,body{height:100%}
body{background:var(--bg);background-attachment:fixed;color:var(--text);font-family:var(--font);overflow-x:hidden;min-height:100vh;transition:background .5s,color .3s;position:relative;}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(circle,rgba(15,143,255,0.14) 1px,transparent 1px);
  background-size:26px 26px;opacity:.55;mask-image:radial-gradient(ellipse at 50% 0%,black 0%,transparent 70%);}
html[data-theme="dark"] body::before{background-image:radial-gradient(circle,rgba(0,229,212,0.14) 1px,transparent 1px);}
.orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(70px);transition:opacity .5s;}
.orb-1{width:620px;height:620px;background:radial-gradient(circle,rgba(0,229,212,.35) 0%,transparent 70%);top:-220px;left:-180px;opacity:.6;}
.orb-2{width:560px;height:560px;background:radial-gradient(circle,rgba(15,143,255,.32) 0%,transparent 70%);bottom:-180px;right:-160px;opacity:.55;}
html[data-theme="dark"] .orb-1{background:radial-gradient(circle,rgba(0,229,212,.22) 0%,transparent 70%);opacity:.7;}
html[data-theme="dark"] .orb-2{background:radial-gradient(circle,rgba(15,143,255,.24) 0%,transparent 70%);opacity:.65;}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
#splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:radial-gradient(circle at 50% 30%,#0a3247 0%,#040a13 70%);transition:opacity .6s ease,transform .6s ease;}
#splash.fade-out{opacity:0;transform:scale(1.06);pointer-events:none;}
.splash-svg{animation:splashSpin .9s cubic-bezier(.34,1.56,.64,1) both;filter:drop-shadow(0 0 24px rgba(0,229,212,.6));}
@keyframes splashSpin{from{opacity:0;transform:rotate(-25deg) scale(.6)}to{opacity:1;transform:rotate(0) scale(1)}}
.splash-brand{font-family:var(--display);font-size:2.6rem;font-weight:800;letter-spacing:2px;animation:splashFade .6s ease .3s both;background:var(--chrome-grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 2px 10px rgba(0,229,212,.4));}
.splash-sub{font-family:var(--mono);font-size:.72rem;color:#7fd8f0;letter-spacing:4px;text-transform:uppercase;animation:splashFade .6s ease .5s both;}
@keyframes splashFade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.splash-road{position:relative;width:200px;height:22px;animation:splashFade .4s ease .7s both;}
.splash-road-line{position:absolute;bottom:5px;left:0;right:0;height:6px;background:rgba(255,255,255,.1);border-radius:8px;overflow:hidden;border:1px solid rgba(0,229,212,.3);}
.splash-road-fill{height:100%;background:linear-gradient(90deg,#00e5d4,#0f8fff);border-radius:8px;animation:splashLoad 1.8s ease .8s both;}
.splash-car{position:absolute;bottom:6px;left:-22px;width:24px;height:24px;animation:splashDrive 1.8s ease .8s both;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4));}
@keyframes splashDrive{from{left:-22px}to{left:calc(100% - 4px)}}
@keyframes splashLoad{from{width:0%}to{width:100%}}
.splash-dots{display:flex;gap:8px;animation:splashFade .4s ease .9s both;}
.splash-dot{width:7px;height:7px;border-radius:50%;background:rgba(0,229,212,.3);}
.splash-dot:nth-child(1){animation:dotPulse 1.2s ease .9s infinite;}
.splash-dot:nth-child(2){animation:dotPulse 1.2s ease 1.1s infinite;}
.splash-dot:nth-child(3){animation:dotPulse 1.2s ease 1.3s infinite;}
@keyframes dotPulse{0%,100%{background:rgba(0,229,212,.25);transform:scale(1)}50%{background:#0f8fff;transform:scale(1.5)}}
.hdr{background:var(--chrome-grad);background-size:220% 220%;animation:chromeShift 12s ease infinite;border-bottom:3px solid rgba(255,255,255,.4);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:100;box-shadow:0 6px 0 rgba(0,0,0,0.12),0 10px 26px rgba(11,111,209,.28);}
@keyframes chromeShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.hdr-left{display:flex;align-items:center;gap:12px;min-width:0;}
.meeg-logo{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.logo-orb{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff 0%,#bdfcf4 18%,#00e5d4 46%,#0f8fff 100%);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 rgba(0,0,0,.18),0 6px 14px rgba(0,0,0,.25),inset 0 2px 4px rgba(255,255,255,.9);flex-shrink:0;}
.meeg-wordmark .brand{font-family:var(--display);font-size:1.3rem;font-weight:800;letter-spacing:.5px;color:#04202b;text-shadow:0 1px 0 rgba(255,255,255,.5);}
.meeg-wordmark .sub{font-family:var(--mono);font-size:.55rem;color:rgba(4,32,43,.65);letter-spacing:1.6px;text-transform:uppercase;margin-top:1px;font-weight:700;}
.hdr-title{border-left:2px dashed rgba(4,32,43,.35);padding-left:12px;min-width:0;}
.hdr-title h1{font-family:var(--display);font-size:.92rem;font-weight:700;color:#04202b;white-space:nowrap;}
.hdr-title h1 span{color:#fff;font-weight:800;text-shadow:0 0 8px rgba(255,255,255,.6);}
.hdr-title p{font-family:var(--mono);font-size:.55rem;color:rgba(4,32,43,.6);margin-top:1px;letter-spacing:.3px;white-space:nowrap;font-weight:600;}
.bdg{display:inline-flex;align-items:center;gap:4px;padding:4px 11px;border-radius:20px;font-size:.55rem;font-weight:800;letter-spacing:.5px;text-transform:uppercase;border:1.5px solid rgba(4,32,43,.25);}
.bdg-info{background:rgba(255,255,255,.35);color:#04202b;}
.bdg-live{background:rgba(4,32,43,.14);color:#04202b;}
.bdg-rows{background:rgba(255,255,255,.35);color:#04202b;}
.tl-dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:2px;opacity:.25;transition:all .2s;}
.tl-dot.tl-red{background:#ff4d4d;}
.tl-dot.tl-yellow{background:#ffb238;}
.tl-dot.tl-green{background:#17b978;}
.tl-dot.active{opacity:1;box-shadow:0 0 4px currentColor;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
.hdr-right{display:flex;align-items:center;gap:7px;flex-wrap:wrap;flex-shrink:0;}
.meta-blk{text-align:right;font-size:.5rem;font-family:var(--mono);}
.meta-blk span{color:rgba(4,32,43,.55);display:block;letter-spacing:.3px;font-weight:600;}
.meta-blk strong{color:#04202b;font-size:.62rem;font-weight:800;}
.btn{padding:8px 14px;border-radius:14px;border:2px solid rgba(4,32,43,.3);background:rgba(255,255,255,.4);color:#04202b;font-size:.62rem;font-weight:800;font-family:var(--font);cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;box-shadow:0 3px 0 rgba(4,32,43,.25);}
.btn:hover{transform:translateY(-2px);box-shadow:0 5px 0 rgba(4,32,43,.25);}
.btn:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(4,32,43,.25);}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
.btn-c{background:#04202b;border-color:#04202b;color:#5cf3e2;font-weight:800;}
.btn-d{background:rgba(255,95,126,.25);border-color:rgba(255,95,126,.5);color:#7a0d24}
.btn-cmp{background:rgba(255,255,255,.4);border-color:rgba(4,32,43,.3);color:#04202b;}
.btn-cmp.active{background:#04202b;color:#5cf3e2;border-color:#04202b;}
.keyfob{position:relative;width:38px;height:46px;cursor:pointer;flex-shrink:0;user-select:none;transition:transform .12s;}
.keyfob:hover{transform:translateY(-2px);}
.keyfob:active{transform:translateY(1px);}
.keyfob-body{position:absolute;inset:0;background:linear-gradient(160deg,#3a3f47 0%,#1c1f24 45%,#0a0c0e 100%);clip-path:polygon(18% 0%,82% 0%,100% 26%,100% 76%,50% 100%,0% 76%,0% 26%);box-shadow:0 3px 0 rgba(0,0,0,.5),0 5px 10px rgba(0,0,0,.35),inset 0 1px 1px rgba(255,255,255,.15);}
.keyfob-edge{position:absolute;inset:0;clip-path:polygon(18% 0%,82% 0%,100% 26%,100% 76%,50% 100%,0% 76%,0% 26%);padding:2px;background:linear-gradient(160deg,#e9edf0,#8b939b 30%,#4a5158 60%,#c7ccd1);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;}
.keyfob-led{position:absolute;top:7px;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:#450d0d;box-shadow:inset 0 1px 1px rgba(0,0,0,.6);transition:all .2s;z-index:2;}
.keyfob.on .keyfob-led{background:#ff4d4d;box-shadow:0 0 6px #ff4d4d,0 0 2px #fff inset;}
#darkFob.on .keyfob-led{background:#5cf3e2;box-shadow:0 0 6px #5cf3e2,0 0 2px #fff inset;}
.keyfob-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-46%);font-size:1rem;z-index:2;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6));transition:transform .2s;}
.keyfob:active .keyfob-icon{transform:translate(-50%,-46%) scale(.88);}
.keyfob-cap{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:.38rem;font-weight:800;letter-spacing:.6px;color:#8b96a0;z-index:2;transition:color .2s;}
.keyfob.on .keyfob-cap{color:#8dffb8;}
#darkFob.on .keyfob-cap{color:#5cf3e2;}
.sync-bar{height:22px;background:rgba(0,229,212,.06);overflow:hidden;position:relative;z-index:99;}
.sync-progress{position:absolute;bottom:2px;left:0;height:3px;width:0%;background:linear-gradient(90deg,var(--teal),var(--blue));border-radius:2px}
.sync-bar.active .sync-progress{animation:syncpulse 1.5s ease-in-out infinite}
.sync-car{position:absolute;bottom:1px;left:-22px;width:20px;height:20px;opacity:0;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3));}
.sync-bar.active .sync-car{opacity:1;animation:syncDrive 1.5s ease-in-out infinite}
@keyframes syncDrive{0%{left:-22px}90%{left:calc(100% - 4px)}100%{left:calc(100% - 4px);opacity:0}}
.btn-refresh-car{width:15px;height:15px;flex-shrink:0;vertical-align:-3px;}
@keyframes syncpulse{0%{width:0%;margin-left:0}50%{width:40%;margin-left:30%}100%{width:0%;margin-left:100%}}
.cmp-bar{background:var(--glass);border-bottom:2px solid var(--border);padding:10px 18px;display:none;align-items:center;gap:12px;flex-wrap:wrap;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);animation:dropin .2s ease-out;}
.cmp-bar.visible{display:flex;}
.cmp-side{display:flex;align-items:center;gap:8px;flex:1;min-width:220px;}
.cmp-label{font-family:var(--display);font-size:.65rem;font-weight:800;text-transform:uppercase;letter-spacing:.6px;padding:4px 10px;border-radius:10px;white-space:nowrap;}
.cmp-label-a{background:rgba(15,143,255,.18);color:var(--cmp-a);border:2px solid rgba(15,143,255,.4);}
.cmp-label-b{background:rgba(0,194,168,.18);color:var(--cmp-b);border:2px solid rgba(0,194,168,.4);}
.cmp-sel{flex:1;padding:7px 12px;border-radius:12px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:.68rem;font-family:var(--font);outline:none;}
.cmp-sel:focus{border-color:var(--accent);}
.cmp-vs{font-family:var(--display);font-size:.85rem;font-weight:800;color:var(--muted);padding:0 4px;}
.cmp-run-btn{padding:8px 18px;border-radius:14px;border:2px solid rgba(4,32,43,.2);background:linear-gradient(135deg,var(--cmp-a),var(--cmp-b));color:#fff;font-size:.68rem;font-weight:800;font-family:var(--font);cursor:pointer;transition:all .15s;white-space:nowrap;box-shadow:0 3px 0 rgba(4,32,43,.2);}
.cmp-run-btn:hover{transform:translateY(-2px);}
.cmp-result{background:var(--glass);border:2px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow);backdrop-filter:var(--blur);margin:0;}
.cmp-result-hd{padding:12px 18px;border-bottom:2px solid var(--border);background:var(--elevated);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.cmp-result-title{font-family:var(--display);font-size:.8rem;font-weight:800;color:var(--text);display:flex;align-items:center;gap:8px;}
.cmp-cols{display:grid;grid-template-columns:1fr 1fr;gap:0;}
.cmp-col{padding:16px;}
.cmp-col-a{border-right:2px dashed var(--border);}
.cmp-col-hd{font-family:var(--display);font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px;padding:5px 10px;border-radius:10px;display:inline-block;}
.cmp-col-hd-a{background:rgba(15,143,255,.14);color:var(--cmp-a);}
.cmp-col-hd-b{background:rgba(0,194,168,.14);color:var(--cmp-b);}
.cmp-stat-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--border-light);}
.cmp-stat-row:last-child{border-bottom:none;}
.cmp-stat-label{font-size:.62rem;color:var(--muted);font-weight:600;}
.cmp-stat-val{font-size:.75rem;font-weight:800;color:var(--text);font-family:var(--mono);}
.cmp-delta{font-size:.55rem;font-weight:800;padding:2px 6px;border-radius:8px;margin-left:4px;}
.cmp-delta-up{background:rgba(23,185,120,.14);color:var(--success);}
.cmp-delta-dn{background:rgba(255,95,126,.14);color:var(--danger);}
.cmp-bar-item{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:.62rem;}
.cmp-bar-name{width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-soft);flex-shrink:0;font-weight:600;}
.cmp-bar-track{flex:1;height:9px;background:var(--border-light);border-radius:6px;overflow:hidden;}
.cmp-bar-fill-a{height:100%;background:var(--cmp-a);border-radius:6px;transition:width .6s cubic-bezier(.34,1.2,.64,1);}
.cmp-bar-fill-b{height:100%;background:var(--cmp-b);border-radius:6px;transition:width .6s cubic-bezier(.34,1.2,.64,1);}
.cmp-bar-num{font-size:.6rem;font-family:var(--mono);font-weight:800;color:var(--muted);min-width:24px;text-align:right;}
.shift-banner{background:var(--glass);border-bottom:2px solid var(--border);padding:9px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);position:relative;z-index:1;}
.shift-banner-label{font-family:var(--display);font-size:.6rem;color:var(--primary);text-transform:uppercase;letter-spacing:.6px;font-weight:800;white-space:nowrap}
.opt-shifts-wrap{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.opt-shift-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:16px;font-size:.6rem;font-weight:700;font-family:var(--font);cursor:pointer;transition:all .15s;border:2px solid var(--border);background:var(--card);color:var(--muted);}
.opt-shift-btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px);}
.opt-shift-btn.on{border-color:var(--teal-deep);background:linear-gradient(135deg,var(--teal),var(--blue));color:#fff;font-weight:800;box-shadow:0 2px 0 rgba(11,111,209,.3);}
.opt-shift-btn .dot{font-size:.55rem}
.fstrip{padding:10px 18px;background:var(--glass);border-bottom:2px solid var(--border);box-shadow:var(--shadow);display:flex;align-items:center;gap:9px;flex-wrap:wrap;position:sticky;top:66px;z-index:90;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);}
.fg{position:relative}
.fchip{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:18px;border:2px solid var(--border);background:var(--card);color:var(--text-soft);font-size:.66rem;font-weight:700;font-family:var(--font);cursor:pointer;transition:all .15s;white-space:nowrap;}
.fchip:hover,.fchip.has-sel{border-color:var(--accent);color:var(--accent);background:var(--accent-light);transform:translateY(-1px);}
.chk-cnt{background:linear-gradient(135deg,var(--teal),var(--blue));color:#fff;border-radius:20px;padding:1px 6px;font-size:.55rem;font-weight:800}
.chk-arr{font-size:.5rem;opacity:.6;transition:transform .2s}
.fchip.open .chk-arr{transform:rotate(180deg)}
.dpanel{position:absolute;top:calc(100% + 8px);left:0;z-index:200;background:var(--bg-3);border:2px solid var(--border);border-radius:18px;min-width:200px;max-width:260px;box-shadow:var(--shadow-hover);display:none;overflow:hidden;backdrop-filter:blur(30px);}
html[data-theme="dark"] .dpanel{background:#0a1a26;}
.dpanel.open{display:block;animation:dropin .15s ease-out}
@keyframes dropin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.dp-srch{width:100%;padding:9px 12px;background:var(--elevated);border:none;border-bottom:2px solid var(--border);color:var(--text);font-size:.68rem;font-family:var(--font);outline:none}
.dp-list{max-height:210px;overflow-y:auto;padding:5px}
.dp-item{display:flex;align-items:center;gap:7px;padding:6px 9px;border-radius:10px;cursor:pointer;font-size:.68rem;transition:background .1s;color:var(--text);}
.dp-item:hover{background:var(--accent-light);}
.dp-item.on{background:linear-gradient(135deg,rgba(0,229,212,.18),rgba(15,143,255,.18));color:var(--primary);font-weight:700;}
.dp-cb{width:14px;height:14px;border:2px solid var(--border);border-radius:5px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.55rem;transition:all .12s}
.dp-item.on .dp-cb{background:linear-gradient(135deg,var(--teal),var(--blue));border-color:transparent;color:#fff}
.dp-cnt{margin-left:auto;font-size:.55rem;color:var(--muted);font-family:var(--mono)}
.dp-foot{padding:6px;border-top:2px solid var(--border);display:flex;gap:5px}
.dp-foot button{flex:1;padding:5px;border-radius:10px;font-size:.58rem;font-weight:700;font-family:var(--font);cursor:pointer;border:2px solid var(--border);background:var(--card);color:var(--muted);transition:all .15s}
.dp-foot button:hover{border-color:var(--accent);color:var(--accent)}
.fsep{width:2px;height:22px;background:var(--border);border-radius:2px;margin:0 3px}
.id-filter-box{display:flex;align-items:center;gap:6px;}
.id-filter-input{padding:6px 13px;border-radius:18px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:.65rem;font-family:var(--mono);outline:none;width:150px;transition:all .2s;}
.id-filter-input:focus{border-color:var(--accent);}
.id-filter-input::placeholder{color:var(--muted);}
.id-filter-x{cursor:pointer;opacity:.6;font-size:.75rem;padding:0 4px;transition:opacity .15s;}
.id-filter-x:hover{opacity:1;}
.pills-row{padding:8px 18px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:34px;background:var(--elevated);border-bottom:2px solid var(--border);backdrop-filter:blur(10px);}
.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 11px;border-radius:16px;font-size:.62rem;font-weight:700;border:2px solid var(--teal-deep);background:linear-gradient(135deg,rgba(0,229,212,.16),rgba(15,143,255,.16));color:var(--primary)}
.pill-x{cursor:pointer;opacity:.6;font-size:.62rem;transition:opacity .15s}
.pill-x:hover{opacity:1}
.pill-all{border-color:var(--border);background:transparent;color:var(--muted)}
.clr-btn{padding:4px 11px;border-radius:16px;border:2px solid rgba(255,95,126,.4);background:rgba(255,95,126,.12);color:var(--danger);font-size:.6rem;font-weight:700;cursor:pointer;transition:all .15s}
.clr-btn:hover{background:rgba(255,95,126,.22)}
.loc-tabs{display:flex;gap:6px;flex-wrap:wrap;padding:12px 18px 0;border-bottom:3px dashed var(--border);background:var(--elevated);backdrop-filter:blur(10px);overflow-x:auto;}
.loc-tab{padding:9px 16px;border-radius:16px 16px 0 0;font-size:.68rem;font-weight:700;cursor:pointer;border:2px solid var(--border);border-bottom:none;background:var(--card);color:var(--text-soft);transition:all .2s;position:relative;bottom:-2px;white-space:nowrap;flex-shrink:0;}
.loc-tab:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px);}
.loc-tab.act{background:linear-gradient(135deg,var(--teal),var(--blue));border-color:transparent;color:#fff;box-shadow:0 -4px 16px rgba(15,143,255,.3);font-weight:800;}
.loc-tab.act::after{content:'📍';position:absolute;top:-13px;left:50%;transform:translateX(-50%);font-size:.65rem;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3));}
.loc-tab .tab-cnt{margin-left:5px;background:rgba(0,0,0,.1);color:inherit;border-radius:20px;padding:1px 6px;font-size:.55rem;font-weight:800}
.loc-tab.act .tab-cnt{background:rgba(255,255,255,.3);}
.loc-all-tab{background:var(--card);border-color:rgba(15,143,255,.3);color:var(--info)}
.loc-all-tab.act{background:linear-gradient(135deg,var(--blue),var(--teal-deep));color:#fff;}
.content{padding:16px 18px;display:flex;flex-direction:column;gap:16px;position:relative;z-index:1;}
.sec{background:var(--glass);border:2px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);transition:box-shadow .25s,transform .25s;}
.sec:hover{box-shadow:var(--shadow-hover);}
.sec-hd{padding:12px 16px;border-bottom:2px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--elevated);flex-wrap:wrap;gap:8px;}
.sec-t{font-family:var(--display);font-size:.8rem;font-weight:700;display:flex;align-items:center;gap:7px;color:var(--text)}
.sec-m{font-size:.6rem;color:var(--muted);font-weight:600;font-family:var(--mono);}
.loc-hdr{background:var(--chrome-grad);background-size:220% 220%;border:2px solid rgba(255,255,255,.4);border-radius:var(--radius-xl);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;box-shadow:var(--shadow);}
.loc-hdr-name{font-family:var(--display);font-size:1.15rem;font-weight:800;letter-spacing:.3px;color:#04202b;text-shadow:0 1px 0 rgba(255,255,255,.4);}
.loc-stats{display:flex;gap:16px;flex-wrap:wrap}
.loc-stat{text-align:center;min-width:60px;background:rgba(255,255,255,.35);border-radius:14px;padding:6px 10px;border:1.5px solid rgba(4,32,43,.15);}
.loc-stat .sv{font-size:1.35rem;font-weight:800;color:#04202b;font-family:var(--mono);}
.loc-stat .sl{font-size:.5rem;color:rgba(4,32,43,.65);text-transform:uppercase;letter-spacing:.6px;margin-top:2px;font-weight:800}
.anim-num{display:inline-block;transition:all .1s;}
.mod-filter-bar{display:flex;align-items:center;gap:6px;padding:8px 16px;border-bottom:2px solid var(--border);flex-wrap:wrap;background:var(--elevated);}
.mod-chip{display:inline-flex;align-items:center;gap:3px;padding:4px 10px;border-radius:14px;font-size:.6rem;font-weight:700;border:2px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;transition:all .15s;}
.mod-chip:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px);}
.mod-chip.on{border-color:currentColor;font-weight:800;}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;padding:14px;background:transparent}
.dcard{background:var(--card);border:2px solid var(--border);border-radius:var(--radius);padding:12px;cursor:pointer;transition:all .18s;position:relative;overflow:hidden;box-shadow:0 3px 0 var(--border);}
.dcard::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,var(--teal),var(--blue));opacity:.35;transition:opacity .2s}
.dcard:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 6px 0 var(--border),var(--shadow-hover);}
.dcard:hover::before,.dcard.sel::before{opacity:1}
.dcard.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light),0 4px 0 var(--border)}
.dc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.dc-pc{font-family:var(--display);font-size:.82rem;font-weight:800;color:var(--primary)}
.dcard.qtc-card{border-color:rgba(139,92,193,.5);background:rgba(139,92,193,.08);}
.dcard.qtc-card::before{background:linear-gradient(90deg,#7d5aa6,#b48bd6)}
.dcard.qtc-card .dc-pc{color:#6b4b96}
.dcard.qtc-card .dc-badge{background:rgba(139,92,193,.15);color:#6b4b96;border:1.5px solid rgba(139,92,193,.4);}
html[data-theme="dark"] .dcard.qtc-card .dc-pc{color:#d8c8ef;}
html[data-theme="dark"] .dcard.qtc-card .dc-badge{color:#d8c8ef;}
.dcard.sl-card{border-color:rgba(255,178,56,.5);background:rgba(255,178,56,.08);}
.dcard.sl-card::before{background:linear-gradient(90deg,#ffb238,#ff8a3d)}
.dcard.sl-card .dc-pc{color:#a8611f}
.dcard.sl-card .dc-badge{background:rgba(255,178,56,.15);color:#a8611f;border:1.5px solid rgba(255,178,56,.4);}
html[data-theme="dark"] .dcard.sl-card .dc-pc{color:#f0b06d;}
html[data-theme="dark"] .dcard.sl-card .dc-badge{color:#f0b06d;}
.dcard.sv-card{border-color:rgba(15,143,255,.5);background:rgba(15,143,255,.08);}
.dcard.sv-card::before{background:linear-gradient(90deg,#0f8fff,#00e5d4)}
.dcard.sv-card .dc-pc{color:#0b6fd1}
.dcard.sv-card .dc-badge{background:rgba(15,143,255,.15);color:#0b6fd1;border:1.5px solid rgba(15,143,255,.4);}
html[data-theme="dark"] .dcard.sv-card .dc-pc{color:#7fc4ff;}
html[data-theme="dark"] .dcard.sv-card .dc-badge{color:#7fc4ff;}
.dc-badge{font-size:.5rem;font-weight:800;padding:2px 7px;border-radius:10px;text-transform:uppercase;letter-spacing:.4px;margin-left:6px;vertical-align:middle;}
.dc-cnt{background:linear-gradient(135deg,var(--teal),var(--blue));color:#fff;font-size:.6rem;font-weight:800;padding:3px 8px;border-radius:12px}
.dc-meta{font-size:.6rem;color:var(--text-soft);margin-bottom:3px;display:flex;align-items:center;gap:4px;overflow:hidden}
.dc-mi{opacity:.6;font-size:.58rem;flex-shrink:0}
.dc-mt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dc-qs{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.qtag{font-size:.55rem;font-weight:700;padding:2px 7px;border-radius:8px;background:var(--accent-light);color:var(--info);border:1.5px solid rgba(15,143,255,.25)}
.catgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;padding:14px;}
.catcard{background:var(--card);border:2px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:0 3px 0 var(--border);transition:box-shadow .18s,transform .18s;position:relative;border-top:3px solid transparent;}
.catcard:hover{transform:translateY(-2px);box-shadow:0 5px 0 var(--border);}
.catcard-hd{padding:9px 14px;display:flex;align-items:center;gap:7px;border-bottom:2px solid var(--border);background:var(--elevated);}
.catcard-hd .cc-ic{font-size:.85rem;flex-shrink:0;line-height:1;}
.catcard-hd .cc-lbl{font-family:var(--display);font-weight:800;font-size:.7rem;color:var(--text);letter-spacing:.2px;}
.catcard-hd .cc-badge{font-size:.5rem;font-weight:800;padding:2px 7px;border-radius:10px;text-transform:uppercase;letter-spacing:.4px;}
.catcard-hd .cc-cnt{margin-left:auto;font-size:.55rem;font-family:var(--mono);color:var(--muted);font-weight:700;}
.catrow{display:flex;align-items:center;gap:8px;padding:7px 14px;border-bottom:1px dashed var(--border-light);font-size:.66rem;}
.catrow:last-child{border-bottom:none;}
.catrow .catname{display:flex;align-items:center;gap:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);font-weight:700;min-width:0;flex-shrink:1;max-width:44%;}
.catrow .catbar{flex:1;height:4px;background:var(--border-light);border-radius:2px;overflow:hidden;min-width:20px;}
.catrow .catbar-fill{height:100%;border-radius:2px;transition:width .5s cubic-bezier(.34,1.2,.64,1);}
.catrow .catval{font-family:var(--mono);font-weight:800;flex-shrink:0;min-width:24px;text-align:right;}
.catempty{padding:14px;color:var(--muted);font-size:.62rem;text-align:center;}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;padding:16px 12px 0;}
.podium-item{flex:1;max-width:34%;display:flex;flex-direction:column;align-items:center;min-width:0;}
.podium-medal{font-size:1rem;margin-bottom:2px;line-height:1;}
.podium-name{font-size:.55rem;font-weight:800;color:var(--text);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;margin-bottom:1px;}
.podium-val{font-family:var(--mono);font-weight:900;font-size:.82rem;margin-bottom:6px;}
.podium-bar{width:100%;border-radius:8px 8px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:5px;font-family:var(--mono);font-weight:800;font-size:.6rem;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);}
.podium-empty .podium-bar{opacity:.25}
.podium-empty .podium-name{opacity:.3}
.podium-empty .podium-val{opacity:.3}
.podium-rest{border-top:1px dashed var(--border-light);margin-top:2px;}
.ttbar{padding:9px 14px;border-bottom:2px solid var(--border);display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:var(--elevated);}
.srch{flex:1;min-width:140px;background:var(--card);border:2px solid var(--border);border-radius:14px;color:var(--text);font-size:.68rem;font-family:var(--font);padding:7px 12px;outline:none;transition:all .2s;}
.srch:focus{border-color:var(--accent);}
.srch::placeholder{color:var(--muted)}
.rcnt{font-size:.6rem;color:var(--muted);font-family:var(--mono);white-space:nowrap;font-weight:700;}
.tbl-w{overflow-x:auto;max-height:380px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
table{width:100%;border-collapse:collapse;font-size:.65rem}
thead th{position:sticky;top:0;z-index:2;background:var(--elevated);color:var(--primary);text-transform:uppercase;font-size:.53rem;letter-spacing:.6px;padding:8px 10px;text-align:left;border-bottom:2px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;font-weight:800;backdrop-filter:blur(14px);}
thead th:hover{color:var(--accent)}
thead th.sa::after{content:' ▲';color:var(--accent);font-size:.5rem}
thead th.sd::after{content:' ▼';color:var(--accent);font-size:.5rem}
tbody tr{border-bottom:1px dashed var(--border-light);transition:background .1s}
tbody tr:hover{background:var(--accent-light);}
td{padding:6px 10px;white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis;color:var(--text-soft)}
td a{color:var(--info);text-decoration:none;font-weight:700;}
.tdq{display:inline-block;padding:3px 7px;border-radius:8px;font-size:.55rem;font-weight:700;background:var(--accent-light);color:var(--info);border:1.5px solid rgba(15,143,255,.25)}
.tds{display:inline-block;padding:3px 7px;border-radius:8px;font-size:.55rem;font-weight:700;background:rgba(23,185,120,.12);color:var(--success);border:1.5px solid rgba(23,185,120,.3)}
.pgbar{padding:8px 14px;border-top:2px solid var(--border);display:flex;align-items:center;gap:5px;flex-wrap:wrap;background:var(--elevated);}
.pg-btn{padding:4px 9px;border-radius:8px;border:2px solid var(--border);background:var(--card);color:var(--text-soft);font-size:.58rem;font-weight:700;cursor:pointer;font-family:var(--font);transition:all .15s;}
.pg-btn:hover{border-color:var(--accent);color:var(--accent);}
.pg-btn.act{background:linear-gradient(135deg,var(--teal),var(--blue));border-color:transparent;color:#fff}
.pg-btn:disabled{opacity:.35;cursor:not-allowed}
.pg-inf{font-size:.55rem;color:var(--muted);margin-left:auto;font-family:var(--mono);font-weight:700;}
.pg-road{position:relative;width:56px;height:16px;margin-left:8px;flex-shrink:0;}
.pg-road-line{position:absolute;top:50%;left:2px;right:2px;height:2px;background:repeating-linear-gradient(90deg,var(--muted) 0 4px,transparent 4px 8px);transform:translateY(-50%);}
.pg-road-car{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:.7rem;transition:left .3s ease;}
.scroll-top-car{position:fixed;bottom:20px;right:18px;width:44px;height:44px;border-radius:50%;background:var(--chrome-grad);border:2px solid rgba(255,255,255,.5);box-shadow:var(--shadow);font-size:1.2rem;cursor:pointer;z-index:9998;transition:transform .2s,opacity .2s;display:none;align-items:center;justify-content:center;opacity:0;}
.scroll-top-car.show{display:flex;opacity:1;}
.scroll-top-car:hover{transform:scale(1.08);}
.web-line{position:fixed;width:2px;background:repeating-linear-gradient(to bottom,#f2f2f2 0 5px,transparent 5px 10px);z-index:9999;pointer-events:none;box-shadow:0 0 5px rgba(255,255,255,.7);transition:height .32s cubic-bezier(.2,.8,.3,1);transform-origin:bottom;}
.web-line::before{content:'';position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:8px;height:8px;border-radius:50%;background:#f2f2f2;box-shadow:0 0 6px rgba(255,255,255,.8);}
.loader{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px;gap:12px}
.spin{width:36px;height:36px;border:4px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp .6s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ltxt{font-size:.65rem;color:var(--muted);letter-spacing:.4px;font-weight:600;}
.empty{text-align:center;padding:34px;color:var(--muted);font-size:.78rem}
.empty span{display:block;font-size:1.8rem;margin-bottom:9px;opacity:.5}
.errbox{background:rgba(255,95,126,.1);border:2px solid rgba(255,95,126,.35);color:var(--danger);border-radius:var(--radius);padding:12px 16px;margin:10px;font-size:.75rem;font-weight:600;}
.toast{position:fixed;bottom:18px;right:18px;background:var(--chrome-grad);color:#04202b;padding:10px 16px;border-radius:16px;font-size:.7rem;font-weight:800;box-shadow:var(--shadow-hover);display:flex;align-items:center;gap:6px;z-index:9999;animation:toastin .3s ease-out;border:2px solid rgba(255,255,255,.5);max-width:calc(100vw - 32px);}
@keyframes toastin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:640px){
  .hdr{padding:10px 12px;gap:8px;}
  .meeg-wordmark .sub,.hdr-title p,.meta-blk{display:none;}
  .hdr-title h1{font-size:.78rem;}
  .bdg-info,.bdg-live{display:none;}
  .hdr-right{gap:5px;}
  .btn{padding:6px 10px;font-size:.58rem;}
  .keyfob{width:32px;height:39px;}
  .keyfob-icon{font-size:.85rem;}
  .keyfob-cap{font-size:.34rem;}
  .fstrip{padding:8px 12px;top:58px;}
  .shift-banner{padding:7px 12px;}
  .opt-shift-btn{padding:4px 9px;font-size:.56rem;}
  .pills-row{padding:6px 12px;}
  .loc-tabs{padding:9px 12px 0;gap:4px;}
  .loc-tab{padding:7px 12px;font-size:.62rem;}
  .content{padding:12px 12px;gap:12px;}
  .cgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:10px;}
  .loc-hdr{padding:12px 14px;}
  .loc-hdr-name{font-size:.92rem;}
  .loc-stat .sv{font-size:1.05rem;}
  .cmp-cols{grid-template-columns:1fr;}
  .cmp-col-a{border-right:none;border-bottom:2px dashed var(--border);}
  .cmp-bar{padding:8px 12px;}
  .cmp-side{min-width:160px;}
  table{font-size:.6rem;}
  td{padding:5px 7px;max-width:120px;}
  thead th{padding:6px 7px;font-size:.48rem;}
  .tbl-w{max-height:300px;}
  .dpanel{max-width:230px;}
}
@media(max-width:400px){
  .hdr-title{display:none;}
  .cgrid{grid-template-columns:1fr 1fr;}
  .cmp-side{flex-direction:column;align-items:flex-start;}
}
#loginScreen{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 20%,#0a3247 0%,#040a13 70%);padding:20px;}
#loginScreen.hidden{display:none;}
.login-card{width:100%;max-width:380px;background:rgba(10,26,38,.55);border:2px solid rgba(0,229,212,.28);border-radius:28px;padding:34px 28px;backdrop-filter:blur(18px);box-shadow:0 12px 40px rgba(0,0,0,.5);text-align:center;position:relative;overflow:hidden;}
.login-logo{width:64px;height:64px;margin:0 auto 14px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff 0%,#bdfcf4 18%,#00e5d4 46%,#0f8fff 100%);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.25),0 8px 18px rgba(0,0,0,.3);}
.login-title{font-family:var(--display);font-size:1.5rem;font-weight:800;color:#fff;letter-spacing:.5px;margin-bottom:2px;}
.login-sub{font-family:var(--mono);font-size:.62rem;color:#7fd8f0;letter-spacing:2px;text-transform:uppercase;margin-bottom:22px;}
.login-input{width:100%;padding:12px 16px;border-radius:16px;border:2px solid rgba(0,229,212,.3);background:rgba(255,255,255,.06);color:#eafcfb;font-size:.85rem;font-family:var(--font);outline:none;transition:all .2s;text-align:center;}
.login-input::placeholder{color:rgba(223,248,251,.4);}
.login-input:focus{border-color:#00e5d4;background:rgba(255,255,255,.1);}
.login-input.err{border-color:#ff5f7e;animation:shakeIn .35s;}
@keyframes shakeIn{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.login-btn-zone{position:relative;width:100%;height:46px;margin-top:14px;}

<script>
/* ============ AUTH GATE ============ */
const ALLOWED_EMAILS=["fpdahmed11@gmail.com","islamyasser424@gmail.com","mahmoudalnoby22@gmail.com","mm0508230@gmail.com","mohamedfathyy69@gmail.com","mostafaatito11158@gmail.com","oka60284@gmail.com","yassinyassen11@gmail.com","me917993@meti.ai","mahmoudseif589@gmail.com","abdallahbarbary39@gmail.com","eslamkhaled329@gmail.com","me370444@meti.ai","me817350@meti.ai"];
const AUTH_KEY='meeg_auth_email';
const AUTH_VER='v2';                 /* change this to any new value = logs everyone out */
const AUTH_VER_KEY='meeg_auth_ver';

function isValidEmailFormat(e){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);}

function getLoggedInEmail(){
  try{
    if(localStorage.getItem(AUTH_VER_KEY)!==AUTH_VER){
      localStorage.removeItem(AUTH_KEY);
      localStorage.removeItem(AUTH_VER_KEY);
      return '';
    }
    return localStorage.getItem(AUTH_KEY)||'';
  }catch(e){return '';}
}

function attemptLogin(){
  const input=document.getElementById('loginEmailInput');
  const errEl=document.getElementById('loginErrMsg');
  const raw=(input.value||'').trim().toLowerCase();
  input.classList.remove('err');
  if(!raw){errEl.textContent='Please enter your email';input.classList.add('err');input.focus();return;}
  if(!isValidEmailFormat(raw)){errEl.textContent='Invalid email format';input.classList.add('err');input.focus();return;}
  if(!ALLOWED_EMAILS.includes(raw)){errEl.textContent='You Are Not Allowed 🚫';input.classList.add('err');input.focus();return;}
  try{
    localStorage.setItem(AUTH_KEY,raw);
    localStorage.setItem(AUTH_VER_KEY,AUTH_VER);
  }catch(e){}
  errEl.textContent='';
  document.getElementById('loginScreen').classList.add('hidden');
  startApp();
}

function logoutUser(){
  try{
    localStorage.removeItem(AUTH_KEY);
    localStorage.removeItem(AUTH_VER_KEY);
  }catch(e){}
  window.location.reload();
}

function checkAuthOnLoad(){
  const email=getLoggedInEmail();
  if(email&&ALLOWED_EMAILS.includes(email)){
    document.getElementById('loginScreen').classList.add('hidden');
    return true;
  }
  document.getElementById('loginScreen').classList.remove('hidden');
  setTimeout(()=>{const i=document.getElementById('loginEmailInput');if(i)i.focus();},80);
  return false;
}

/* if the session was invalidated (logout from another tab / new auth version) — show the login screen immediately */
function enforceAuthLive(){
  const email=getLoggedInEmail();
  if(email&&ALLOWED_EMAILS.includes(email))return;
  if(typeof autoRefreshTimer!=='undefined'&&autoRefreshTimer){clearInterval(autoRefreshTimer);autoRefreshTimer=null;}
  if(typeof _versionCheckTimer!=='undefined'&&_versionCheckTimer){clearInterval(_versionCheckTimer);_versionCheckTimer=null;}
  const ls=document.getElementById('loginScreen');
  if(ls)ls.classList.remove('hidden');
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible')enforceAuthLive();
});
window.addEventListener('storage',e=>{
  if(e.key===AUTH_KEY||e.key===AUTH_VER_KEY||e.key===null)enforceAuthLive();
});

/* ============ LOGIN BUTTON DODGE (roams only inside the login card frame) ============ */
function initLoginDodge(){
  const btn=document.getElementById('loginSubmitBtn');
  const zone=document.getElementById('loginBtnZone');
  const card=document.getElementById('loginCard');
  const input=document.getElementById('loginEmailInput');
  if(!btn||!zone||!card||!input)return;
  let dodging=false;
  function resetBtn(){
    dodging=false;
    btn.classList.remove('dodging');
    btn.style.left='';btn.style.top='';btn.style.width='';btn.style.position='';
  }
  document.addEventListener('mousemove',(e)=>{
    if(input.value.trim().length>0){ if(dodging)resetBtn(); return; }
    const btnRect=btn.getBoundingClientRect();
    const cardRect=card.getBoundingClientRect();
    const btnCx=btnRect.left+btnRect.width/2;
    const btnCy=btnRect.top+btnRect.height/2;
    const mx=e.clientX, my=e.clientY;
    const dist=Math.hypot(mx-btnCx,my-btnCy);
    if(dist<95){
      dodging=true;
      btn.classList.add('dodging');
      btn.style.position='fixed';
      const bw=Math.min(150,cardRect.width-2*14),bh=btnRect.height||46;
      const pad=14;
      const minLeft=cardRect.left+pad;
      const maxLeft=Math.max(minLeft,cardRect.right-bw-pad);
      const minTop=cardRect.top+pad;
      const maxTop=Math.max(minTop,cardRect.bottom-bh-pad);
      let newLeft,newTop,tries=0;
      do{
        newLeft=minLeft+Math.random()*(maxLeft-minLeft);
        newTop=minTop+Math.random()*(maxTop-minTop);
        tries++;
      }while(Math.hypot(newLeft+bw/2-mx,newTop+bh/2-my)<90 && tries<12);
      btn.style.width=bw+'px';
      btn.style.left=newLeft+'px';
      btn.style.top=newTop+'px';
    }
  });
  input.addEventListener('input',()=>{ if(input.value.trim().length>0)resetBtn(); });
}
/* ============ END AUTH GATE ============ */

/* ============ FORCE REFRESH ON NEW VERSION ============ */
const CURRENT_APP_VERSION = (document.querySelector('meta[name="app-version"]')||{}).content || '0';
let _versionCheckTimer = null;

function checkForNewVersion(){
  const bustUrl = window.location.href.split('#')[0] + (window.location.href.includes('?') ? '&' : '?') + '_v=' + Date.now();
  fetch(bustUrl, {cache:'no-store'})
    .then(r => r.text())
    .then(html => {
      const match = html.match(/<meta\s+name=["']app-version["']\s+content=["']([^"']+)["']/i);
      const serverVersion = match ? match[1] : null;
      if(serverVersion && serverVersion !== CURRENT_APP_VERSION){
        showReloadToast();
      }
    })
    .catch(()=>{ /* silent fail — don't disrupt the user on a network hiccup */ });
}

function showReloadToast(){
  const ex = document.querySelector('.toast'); if(ex) ex.remove();
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = '🔄 A new dashboard version is available — reloading automatically...';
  document.body.appendChild(t);
  setTimeout(() => window.location.reload(), 2500);
}

function startVersionPolling(){
  if(_versionCheckTimer) clearInterval(_versionCheckTimer);
  _versionCheckTimer = setInterval(checkForNewVersion, 60000); // every minute
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible') checkForNewVersion();
  });
}
/* ============ END FORCE REFRESH ============ */

function hideSplash(){const s=document.getElementById('splash');if(s){setTimeout(()=>{s.classList.add('fade-out');setTimeout(()=>s.remove(),650);},2200);}}
function toggleDark(){const html=document.documentElement;const isDark=html.getAttribute('data-theme')==='dark';const t=isDark?'light':'dark';html.setAttribute('data-theme',t);const btn=document.getElementById('darkBtn');if(btn){btn.classList.toggle('active',t==='dark');btn.innerHTML=t==='dark'?'🌙 Dark':'☀️ Light';}localStorage.setItem('meeg_theme',t);}
let autoRefreshEnabled=(function(){try{const v=localStorage.getItem('meeg_autorefresh');return v===null?true:v==='1';}catch(e){return true;}})();
function applyAutoRefreshUI(){const btn=document.getElementById('arBtn');if(!btn)return;btn.classList.toggle('active',autoRefreshEnabled);btn.innerHTML=autoRefreshEnabled?'🔄 Auto':'⏸️ Off';}
function toggleAutoRefresh(){autoRefreshEnabled=!autoRefreshEnabled;try{localStorage.setItem('meeg_autorefresh',autoRefreshEnabled?'1':'0');}catch(e){}applyAutoRefreshUI();if(autoRefreshEnabled){if(autoRefreshTimer)clearInterval(autoRefreshTimer);autoRefreshTimer=setInterval(loadData,REFRESH_INTERVAL*1000);showToast('⏱️ Auto-refresh ON');}else{if(autoRefreshTimer)clearInterval(autoRefreshTimer);autoRefreshTimer=null;showToast('⏸️ Auto-refresh OFF');}}
function saveFilters(){try{const state={sel:Object.fromEntries(Object.entries(sel).map(([k,v])=>[k,[...v]])),selD:[...selD],selWeeks:[...selWeeks],idFilter,shifts:Object.fromEntries(Object.entries(shiftState).map(([k,v])=>[k,v.on])),activeLoc};localStorage.setItem('meeg_filters',JSON.stringify(state));}catch(e){}}
function restoreFilters(){try{const raw=localStorage.getItem('meeg_filters');if(!raw)return;const state=JSON.parse(raw);if(state.sel)Object.entries(state.sel).forEach(([k,arr])=>{sel[k]=new Set(arr);});if(state.selD)state.selD.forEach(d=>selD.add(d));if(state.selWeeks)state.selWeeks.forEach(w=>selWeeks.add(w));if(state.idFilter)idFilter=state.idFilter;if(state.shifts)Object.entries(state.shifts).forEach(([k,on])=>{if(shiftState[k]){shiftState[k].on=on;const btn=document.getElementById('btn_'+k);if(btn){btn.classList.toggle('on',on);btn.querySelector('.dot').textContent=on?'●':'○';}}});if(state.activeLoc)activeLoc=state.activeLoc;}catch(e){}}
function animateNum(el,target,duration=900){const start=performance.now();function step(now){const p=Math.min((now-start)/duration,1);const ease=1-Math.pow(1-p,3);el.textContent=Math.round(ease*(target)).toLocaleString();if(p<1)requestAnimationFrame(step);else el.textContent=target.toLocaleString();}requestAnimationFrame(step);}
function animateAllNums(){document.querySelectorAll('[data-anim-num]').forEach(el=>{const t=parseInt(el.getAttribute('data-anim-num'));if(!isNaN(t))animateNum(el,t);});}
let cmpMode=false;
function toggleCompare(){cmpMode=!cmpMode;const bar=document.getElementById('cmpBar');const btn=document.getElementById('cmpBtn');bar.classList.toggle('visible',cmpMode);btn.classList.toggle('active',cmpMode);btn.textContent=cmpMode?'✕ Close':'⚖️ Compare';if(cmpMode)populateCmpSelects();else{const old=document.getElementById('cmpResultSection');if(old)old.remove();}}
function populateCmpSelects(){const dates=sOpts._dates||[];const weeks=window._weekList||[];const opts=['<option value="">— Select Period —</option>','<optgroup label="── Today / Yesterday ──">','Today','Yesterday'].map((l,i)=>i<2?l:`<option value="special_${l.toLowerCase()}">${l}</option>`).join('')+'</optgroup><optgroup label="── Weeks ──">'+weeks.slice(0,12).map(w=>`<option value="week_${esc(w)}">${esc(w)}</option>`).join('')+'</optgroup><optgroup label="── Dates ──">'+dates.slice(0,30).map(d=>`<option value="date_${d}">${d}${d===todayStr?' ⭐':''}</option>`).join('')+'</optgroup>';document.getElementById('cmpSelA').innerHTML=opts;document.getElementById('cmpSelB').innerHTML=opts;}
function getRowsForPeriod(val){if(!val)return[];if(val==='special_today')return rawRows.filter(r=>isRowAllowed(r)&&rDate(r)===todayStr);if(val==='special_yesterday'){const d=new Date(todayStr+'T12:00:00');d.setDate(d.getDate()-1);const yest=d.toISOString().substring(0,10);return rawRows.filter(r=>isRowAllowed(r)&&rDate(r)===yest);}if(val.startsWith('week_')){const wLabel=val.replace('week_','');const dates=(window._weekMap||{})[wLabel]||[];return rawRows.filter(r=>isRowAllowed(r)&&dates.includes(rDate(r)));}if(val.startsWith('date_')){const d=val.replace('date_','');return rawRows.filter(r=>isRowAllowed(r)&&rDate(r)===d);}return[];}

function mondayOf(d){
  const dt=d?new Date(d+'T12:00:00'):new Date();
  const day=dt.getDay();
  const diff=day===0?-6:1-day;
  const mon=new Date(dt);mon.setDate(dt.getDate()+diff);
  return mon;
}
function computeQualityWeekLabel(dateStr){
  const mon=mondayOf(dateStr);
  if(isNaN(mon.getTime()))return null;
  const dd=String(mon.getDate()).padStart(2,'0');
  const monthShort=mon.toLocaleString('en-US',{month:'short'});
  return `Week of ${dd} ${monthShort}`;
}

// turns whatever is written in the TEAMS "Shift" column into one of the 3 groups
function teamsShiftGroup(v){
  const t=String(v||'').trim().toLowerCase();
  if(!t)return null;
  if(SHIFT_GROUP_OF[t])return SHIFT_GROUP_OF[t];
  if(t==='on'||/over\s*-?\s*night|\(on\)|\bon\b/.test(t))return'Overnight';
  if(t==='m'||/morning|\(m\)|\bam\b/.test(t))return'Morning';
  if(t==='n'||/night|\(n\)|\bpm\b/.test(t))return'Night';
  return null;
}
// match on the part before "@" so tiny differences (case, spaces, domain) never break the lookup
function teamsKey(em){return String(em||'').trim().toLowerCase().split('@')[0].replace(/\s+/g,'');}
function loadTeamsMap(){
  if(teamsLoading)return;
  teamsLoading=true;
  try{const raw=localStorage.getItem(TEAMS_CACHE_KEY);if(raw&&!teamsLoaded){teamsMap=JSON.parse(raw)||{};}}catch(e){}
  fetch(TEAMS_GID?`https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${TEAMS_GID}`:`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(TEAMS_SHEET_NAME)}`)
    .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text();})
    .then(txt=>{
      const table=parseCSV(txt);
      const hi=table.findIndex(r=>r.some(c=>/yubikey/i.test(String(c||''))));
      if(hi<0)throw new Error('Yubikey column not found in TEAMS');
      const h=table[hi].map(c=>String(c||'').trim().toLowerCase().split(/\s+/).slice(0,2).join(' '));
      const ei=h.findIndex(c=>/yubikey/.test(c));
      const si=h.findIndex(c=>c==='shift'||/^shift\b/.test(c));
      const qi=h.findIndex(c=>/qtc|tl/.test(c)&&c!==h[ei]);
      if(si<0&&qi<0)throw new Error('Shift column not found in TEAMS');
      const map={};const tlMap={};
      for(let i=hi+1;i<table.length;i++){
        const r=table[i];if(!r)continue;
        const k=teamsKey(r[ei]);if(!k)continue;
        let g=si>=0?teamsShiftGroup(r[si]):null;
        if(!g&&qi>=0)g=qtcShiftGroup(r[qi]);
        if(g){map[k]=g;if(qi>=0&&String(r[qi]||'').trim())tlMap[k]=String(r[qi]).trim();}
      }
      teamsDebug='rows='+table.length+' | header='+h.join(' / ')+' | emailCol='+ei+' shiftCol='+si+' | sample='+JSON.stringify((table[hi+1]||[]).slice(0,4));
      // fallback: if the header-based read found nothing, scan every row — any cell with "@" is the flash, any M/N/ON/Morning/Night/Overnight cell (or a "(ON)" tag) is the shift
      if(!Object.keys(map).length){
        table.forEach(r=>{
          if(!r)return;
          const ec=r.find(c=>String(c||'').includes('@'));if(!ec)return;
          let g=null;
          for(const c of r){if(c===ec)continue;g=teamsShiftGroup(c)||qtcShiftGroup(c);if(g)break;}
          if(g)map[teamsKey(ec)]=g;
        });
        teamsDebug+=' | fallback used';
      }
      teamsUsingSnapshot=false;
      const liveCount=Object.keys(map).length;
      // live Teams tab wins wherever it has data; the built-in copy only fills Yubikeys the live read is missing
      if(liveCount<Object.keys(TEAMS_SNAPSHOT).length*0.5){
        Object.keys(TEAMS_SNAPSHOT).forEach(k=>{if(!map[k])map[k]=TEAMS_SNAPSHOT[k];});
        teamsUsingSnapshot=true;
        teamsDebug='live read only found '+liveCount+' Yubikeys | '+teamsDebug;
      }
      Object.keys(TEAMS_TL_SNAPSHOT).forEach(k=>{if(!tlMap[k])tlMap[k]=TEAMS_TL_SNAPSHOT[k];});
      teamsTL=tlMap;
      teamsMap=map;teamsLoaded=true;teamsLoading=false;
      showToast(teamsUsingSnapshot?'⚠️ Live Teams tab looks incomplete — filled from built-in copy ('+Object.keys(map).length+' Yubikeys)':'✅ Teams loaded: '+Object.keys(map).length+' Yubikeys');
      try{localStorage.setItem(TEAMS_CACHE_KEY,JSON.stringify(map));}catch(e){}
      if(activeLoc==='__quality__')renderAllSections();
    })
    .catch(e=>{teamsLoading=false;teamsDebug='error: '+e.message;if(!Object.keys(teamsMap).length){teamsMap=Object.assign({},TEAMS_SNAPSHOT);teamsTL=Object.assign({},TEAMS_TL_SNAPSHOT);teamsUsingSnapshot=true;teamsLoaded=true;if(activeLoc==='__quality__')renderAllSections();}showToast('⚠️ Could not read live Teams tab ('+e.message+') — using built-in copy');});
}
function computeQualityIdInfo(){
  const emailIdx=sIdx['Yubikey Email'];const nameIdx=sIdx['Labeler Name'];const qtcIdx=hdrs.findIndex(h=>h.toLowerCase()==='qtc name');
  const idIdx=hdrs.findIndex(h=>h.toLowerCase()==='id');
  const idInfo={};
  if(idIdx<0)return idInfo;
  rawRows.forEach(r=>{
    const rid=String(r[idIdx]||'').trim();if(!rid)return;
    const em=emailIdx!==undefined?String(r[emailIdx]||'').trim():'';
    const nm=nameIdx!==undefined?String(r[nameIdx]||'').trim():'';
    const qtc=qtcIdx>=0?String(r[qtcIdx]||'').trim():'';
    const grp=qtcShiftGroup(qtc);
    idInfo[rid]={name:nm||em||rid,email:em,qtc,group:grp};
  });
  return idInfo;
}
// scans every Data Base row for a given Yubikey Email and works out which shift it shows up under most often —
// used to place an Unmatched task (no Actual ID match) on a shift when the email itself is a known, repeated labeler
function computeEmailShiftInfo(){
  const emailIdx=sIdx['Yubikey Email'];const nameIdx=sIdx['Labeler Name'];const qtcIdx=hdrs.findIndex(h=>h.toLowerCase()==='qtc name');
  const info={};
  if(emailIdx===undefined)return info;
  rawRows.forEach(r=>{
    const em=String(r[emailIdx]||'').trim();if(!em)return;
    const ek=em.toLowerCase();
    const nm=nameIdx!==undefined?String(r[nameIdx]||'').trim():'';
    const qtc=qtcIdx>=0?String(r[qtcIdx]||'').trim():'';
    const grp=qtcShiftGroup(qtc);
    if(!info[ek])info[ek]={email:em,counts:{Morning:0,Night:0,Overnight:0},names:{}};
    const e=info[ek];
    if(grp)e.counts[grp]=(e.counts[grp]||0)+1;
    if(nm)e.names[nm]=(e.names[nm]||0)+1;
  });
  Object.values(info).forEach(e=>{
    let bestGrp=null,bestC=0;
    Object.entries(e.counts).forEach(([g,n])=>{if(n>bestC){bestC=n;bestGrp=g;}});
    e.group=bestC>0?bestGrp:null;
    let bestName=null,bestNc=-1;
    Object.entries(e.names).forEach(([n,c])=>{if(c>bestNc){bestNc=c;bestName=n;}});
    e.name=bestName||e.email;
  });
  return info;
}

function copyShiftIds(grp){
  const ids=(window._qualityShiftIds||{})[grp]||[];
  if(!ids.length){showToast('⚠️ No IDs to copy');return;}
  const text=ids.join('\n');
  const done=()=>showToast('✅ Copied '+ids.length+' IDs — '+(grp==='Unassigned'?'No shift':grp));
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
  }else fallbackCopy(text,done);
}
function fallbackCopy(text,done){
  const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');done();}catch(e){showToast('⚠️ Copy failed — select the text manually');}
  ta.remove();
}

function extractDate(v){

  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m)return m[3]+'-'+m[1].padStart(2,'0')+'-'+m[2].padStart(2,'0');
  m=s.match(/^(\d{1,2})[.\-](\d{1,2})[.\-](\d{4})/);
  if(m)return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  m=s.match(/^(\d{1,2})[\s-]([A-Za-z]{3,9})[\s-](\d{4})/);

  if(m){const mm=_MONTH_NAMES[m[1].slice(0,3).toLowerCase()];if(mm)return m[3]+'-'+String(mm).padStart(2,'0')+'-'+m[2].padStart(2,'0');}

    const serial=parseFloat(s);

  if(!isNaN(generic.getTime()))return generic.getFullYear()+'-'+String(generic.getMonth()+1).padStart(2,'0')+'-'+String(generic.getDate()).padStart(2,'0');
  return null;
}

/* ===== PATCH #1: debounce table search (locSrch) ===== */
let _srchDebounce={};
function locSrch(locKey,val){

    locSearch[locKey]=val;

}
function getLocRows(locKey){if(locKey==='all'||locColIdx<0)return fcache;return fcache.filter(r=>String(r[locColIdx]||'').trim()===locKey);}
function renderLocTable(locKey,baseRows,pg){const tblEl=document.getElementById('tbl_'+sid(locKey)),pgEl=document.getElementById('pg_'+sid(locKey));const rcEl=document.getElementById('rc_'+sid(locKey)),metaEl=document.getElementById('tblMeta_'+sid(locKey));if(!tblEl)return;const q=(locSearch[locKey]||'').toLowerCase().trim();let rows=q?baseRows.filter(r=>r.some(c=>String(c??'').toLowerCase().includes(q))):baseRows;if(sortC>=0)rows=[...rows].sort((a,b)=>String(a[sortC]??'').localeCompare(String(b[sortC]??''),undefined,{numeric:true})*sortDr);if(rcEl)rcEl.textContent=`${rows.length} row${rows.length!==1?'s':''}`;if(metaEl)metaEl.textContent=`${rows.length} rows shown`;const tp=Math.max(1,Math.ceil(rows.length/PGSZ));const cp=Math.min(pg,tp-1);const st=cp*PGSZ,en=Math.min(st+PGSZ,rows.length),pr=rows.slice(st,en);const hl=hdrs.map(h=>h.toLowerCase());const linkIdx=hl.findIndex(h=>h==='task link'||h==='link');const objIdx=hl.findIndex(h=>h==='object count');const hiddenCols=new Set(linkIdx>=0&&objIdx>=0?[objIdx]:[]);const thArr=[];hdrs.forEach((h,i)=>{if(hiddenCols.has(i))return;if(!h||h==='—')return;const cls=i===sortC?(sortDr===1?'sa':'sd'):'';thArr.push(`<th class="${cls}" data-ci="${i}">${esc(h)}</th>`);if(i===linkIdx&&objIdx>=0)thArr.push(`<th style="background:var(--elevated);color:var(--text-soft);text-transform:uppercase;font-size:.52rem;padding:6px 8px;border-bottom:1.5px solid var(--border);font-weight:700;white-space:nowrap">Objects</th>`);});const trs=pr.map(r=>{const cells=[];r.forEach((c,ci)=>{if(hiddenCols.has(ci))return;if(!hdrs[ci]||hdrs[ci]==='—')return;const h=hl[ci]||'';let v=c===null||c===undefined?'':String(c);if((h==='task link'||h==='link')&&v.startsWith('http'))v=`<a href="${esc(v)}" target="_blank" rel="noopener">🔗</a>`;else if(h==='queue name'&&v)v=`<span class="tdq">${esc(v)}</span>`;else if(h==='shift'&&v)v=`<span class="tds">${esc(v)}</span>`;else v=esc(v);cells.push(`<td title="${esc(String(c??''))}">${v}</td>`);if(ci===linkIdx&&objIdx>=0){const objVal=String(r[objIdx]??'').trim();const num=parseFloat(objVal);const disp=!isNaN(num)?`<span style="font-family:var(--mono);font-weight:700;color:var(--accent);font-size:.65rem">${num.toLocaleString()}</span>`:`<span style="color:var(--muted);font-size:.62rem">—</span>`;cells.push(`<td style="white-space:nowrap;text-align:right">${disp}</td>`);}});return`<tr>${cells.join('')}</tr>`;}).join('')||`<tr><td colspan="${thArr.length}" style="text-align:center;padding:22px;color:var(--muted)">No rows match.</td></tr>`;window['baseRows_'+sid(locKey)]=baseRows;tblEl.innerHTML=`<table><thead><tr>${thArr.join('')}</tr></thead><tbody>${trs}</tbody></table>`;tblEl.querySelectorAll('thead th[data-ci]').forEach(th=>{const ci=parseInt(th.dataset.ci);th.onclick=()=>srtBy(ci,locKey,baseRows);});if(!pgEl)return;if(tp<=1){pgEl.style.display='none';return;}pgEl.style.display='flex';let pgH=`<button class="pg-btn" onclick="renderLocTable('${locKey}',window['baseRows_${sid(locKey)}'],${cp-1})" ${cp===0?'disabled':''}>‹</button>`;const lo=Math.max(0,cp-2),hi=Math.min(tp-1,cp+2);if(lo>0)pgH+=`<button class="pg-btn" onclick="renderLocTable('${locKey}',window['baseRows_${sid(locKey)}'],0)">1</button>${lo>1?'<span style="color:var(--muted);padding:0 2px;font-size:.58rem">…</span>':''}`;for(let p=lo;p<=hi;p++)pgH+=`<button class="pg-btn${p===cp?' act':''}" onclick="renderLocTable('${locKey}',window['baseRows_${sid(locKey)}'],${p})">${p+1}</button>`;if(hi<tp-1)pgH+=`${hi<tp-2?'<span style="color:var(--muted);padding:0 2px;font-size:.58rem">…</span>':''}<button class="pg-btn" onclick="renderLocTable('${locKey}',window['baseRows_${sid(locKey)}'],${tp-1})">${tp}</button>`;pgH+=`<button class="pg-btn" onclick="renderLocTable('${locKey}',window['baseRows_${sid(locKey)}'],${cp+1})" ${cp===tp-1?'disabled':''}>›</button>`;pgH+=`<span class="pg-inf">${st+1}–${en} / ${rows.length}</span>`;const roadPct=tp>1?Math.round(cp/(tp-1)*100):0;pgH+=`<div class="pg-road"><div class="pg-road-line"></div><div class="pg-road-car" style="left:${roadPct}%">🚗</div></div>`;pgEl.innerHTML=pgH;}
function srtBy(ci,locKey,baseRows){if(sortC===ci)sortDr*=-1;else{sortC=ci;sortDr=1;}renderLocTable(locKey,baseRows,0);}
let _toastTimer=null;

/* ===== PATCH #4 (helper): toast with an inline action button (used by Undo Clear All) ===== */

function shootWebScrollTop(){
  const btn=document.getElementById('scrollTopBtn');
  if(!btn)return;
  const rect=btn.getBoundingClientRect();
  const cx=rect.left+rect.width/2;
  const web=document.createElement('div');
  web.className='web-line';
  web.style.left=(cx-1)+'px';
  web.style.bottom=(window.innerHeight-rect.top)+'px';
  web.style.height='0px';
  document.body.appendChild(web);
  btn.style.transform='scale(.82) rotate(-8deg)';
  requestAnimationFrame(()=>{
    web.style.height=Math.max(rect.top-10,10)+'px';
  });
  setTimeout(()=>{ window.scrollTo({top:0,behavior:'smooth'}); btn.style.transform=''; },140);
  setTimeout(()=>{ web.remove(); },520);
}
